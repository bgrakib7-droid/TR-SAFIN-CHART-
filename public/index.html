<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2d"><meta name="description" content="TR SAFIN CHAT"><link rel="manifest" href="/manifest.webmanifest"><title>TR SAFIN CHAT</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1423;color:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit;border:0;border-radius:12px;padding:13px}button{background:#3478f6;color:white;font-weight:700;cursor:pointer}.wrap{max-width:1000px;margin:auto;padding:18px}.brand{font-size:24px;font-weight:900;letter-spacing:1px}.muted{color:#9aabc2}.panel{background:#142238;border:1px solid #263a56;border-radius:18px;padding:18px;margin-top:18px}input{width:100%;background:#0c192b;color:white;margin:6px 0 12px;border:1px solid #314660}label{display:block}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none!important}#rooms button{display:block;width:100%;text-align:left;margin:7px 0;background:#203653}#messages{height:48vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px}.msg{background:#203653;border-radius:14px;padding:10px;max-width:85%;align-self:flex-start;overflow-wrap:anywhere}.mine{background:#2456a0;align-self:flex-end}.small{font-size:12px;color:#b5c4d8}.bar{display:flex;gap:8px}.bar input{margin:0}.status{min-height:22px;color:#ffca80}@media(min-width:700px){.columns{display:grid;grid-template-columns:280px 1fr;gap:16px}}
</style></head><body><div class="wrap"><div class="brand">🟦 TR SAFIN CHAT</div><p class="muted">নিজস্ব মেসেজিং অ্যাপ · Android ও কম্পিউটার</p>
<section id="auth" class="panel"><h2>স্বাগতম</h2><label>নাম (নতুন অ্যাকাউন্টে)<input id="name" placeholder="আপনার নাম"></label><label>ইমেইল<input id="email" type="email" autocomplete="email"></label><label>পাসওয়ার্ড<input id="password" type="password" minlength="6"></label><div class="row"><button id="login">লগইন</button><button id="register">অ্যাকাউন্ট খুলুন</button></div><p id="authStatus" class="status"></p></section>
<section id="app" class="hidden"><div class="row panel"><div><b id="me"></b><div class="small" id="uid"></div></div><button id="logout">লগআউট</button></div><div class="columns"><aside class="panel"><h3>চ্যাট</h3><button id="newChat">＋ নতুন চ্যাট (UID)</button><div id="rooms"></div><p class="small">নিজের UID অন্য সদস্যকে দিলে তারা চ্যাট শুরু করতে পারবে।</p></aside><main class="panel"><h3 id="roomTitle">একটি চ্যাট বাছাই করুন</h3><div id="messages"></div><form id="sendForm" class="bar"><input id="message" placeholder="মেসেজ লিখুন…" maxlength="4000"><button>পাঠান</button></form></main></div></section><p id="status" class="status"></p><p class="small">প্রাথমিক সংস্করণ: রিয়েল-টাইম টেক্সট চ্যাট। অডিও/ভিডিও কল ও অ্যাডমিন কন্ট্রোল পরবর্তী ধাপে যুক্ত হবে।</p></div><script type="module" src="/app.js"></script></body></html>
